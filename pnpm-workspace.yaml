packages:
  - .
  - ui
  - packages/*
  - extensions/*

overrides:
  "@anthropic-ai/sdk": 0.90.0
  "@hono/node-server": 1.19.14
  axios: 1.15.0
  basic-ftp: 5.3.0
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  file-type: 22.0.1
  follow-redirects: 1.16.0
  form-data: 2.5.4
  hono: 4.12.14
  minimatch: 10.2.4
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  path-to-regexp: 8.4.0
  protobufjs: 7.5.5
  qs: 6.14.2
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  tar: 7.5.13
  tough-cookie: 4.1.3
  typebox: 1.1.31
  uuid: 14.0.0
  yauzl: 3.2.1

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "acpx"
  - "axios"
  - "basic-ftp"
  - "hono"
  - "openclaw"
  - "protobufjs"
  - "@buape/carbon"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "axios@1.15.0"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

nodeLinker: hoisted
blockExoticSubdeps: true

allowBuilds:
  "@discordjs/opus": false
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@napi-rs/canvas": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  "@whiskeysockets/baileys": true
  authenticate-pam: true
  esbuild: true
  koffi: false
  node-llama-cpp: true
  protobufjs: true
  sharp: true

packageExtensions:
  "@mariozechner/pi-coding-agent":
    dependencies:
      strip-ansi: ^7.2.0

peerDependencyRules:
  allowedVersions:
    "prism-media>opusscript": "^0.0.8 || ^0.1.1"
